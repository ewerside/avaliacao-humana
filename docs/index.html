<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Avaliação</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --tx: #16181d; --tx2: #5b6270; --linha: #dfe3ea;
  --pri: #2453d6; --pri-tx: #ffffff; --ok: #1d7f45; --nao: #b3261e; --neutro: #6b7280;
  --sel: #e8eefc; --raio: 14px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1115; --card: #181b21; --tx: #eef0f4; --tx2: #a3aab7; --linha: #2b3039;
          --pri: #6d93ff; --pri-tx: #0b0d12; --sel: #1f2a44; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--tx);
  font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
main { max-width: 980px; margin: 0 auto; padding: 14px 14px 140px; }
h1 { font-size: 22px; margin: 6px 0 12px; }
h2 { font-size: 18px; margin: 4px 0 10px; }
p { margin: 8px 0; }
.card { background: var(--card); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px; margin: 12px 0; }
.sub { color: var(--tx2); font-size: 15px; }
input[type=text], textarea { width: 100%; font: inherit; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--linha); background: var(--bg); color: var(--tx); }
textarea { min-height: 70px; resize: vertical; }
button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--linha);
  background: var(--card); color: var(--tx); padding: 14px 16px; min-height: 54px; }
button:focus-visible { outline: 3px solid var(--pri); outline-offset: 2px; }
button.pri { background: var(--pri); color: var(--pri-tx); border-color: var(--pri); font-weight: 600; }
button.link { background: none; border: none; color: var(--tx2); min-height: 40px; padding: 8px 6px; text-decoration: underline; }
button:disabled { opacity: .55; cursor: default; }
.largo { width: 100%; }
.tecla { display: inline-block; min-width: 1.5em; font-size: 12px; color: var(--tx2); border: 1px solid var(--linha);
  border-radius: 5px; padding: 0 4px; margin-left: 6px; vertical-align: middle; }
.toque .tecla { display: none; }
/* progresso */
.topo { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 6px; }
.barra { height: 8px; background: var(--linha); border-radius: 99px; overflow: hidden; }
.barra > div { height: 100%; background: var(--pri); width: 0; transition: width .25s; }
.cont { display: flex; justify-content: space-between; font-size: 14px; color: var(--tx2); margin-top: 4px; }
/* painéis */
.pergunta { font-size: 19px; font-weight: 600; margin: 6px 0 10px; }
.texto { white-space: pre-wrap; }
.paineis { display: grid; grid-template-columns: repeat(var(--np, 2), minmax(0, 1fr)); gap: 10px; }
.painel { background: var(--card); border: 1px solid var(--linha); border-radius: var(--raio); padding: 8px; min-width: 0; }
.rotulo { font-size: 13px; font-weight: 600; color: var(--tx2); text-transform: uppercase; letter-spacing: .03em; margin: 2px 4px 6px; }
.imgbox { position: relative; background: #00000010; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  height: min(52vh, 460px); overflow: hidden; cursor: zoom-in; }
.imgbox img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.imgbox .lupa { position: absolute; right: 6px; bottom: 6px; background: #000a; color: #fff; font-size: 12px; border-radius: 8px; padding: 2px 7px; }
.painel .texto, .opcao .texto { padding: 6px 4px; max-height: 40vh; overflow: auto; }
@media (max-width: 640px) {
  main { padding: 8px 10px 150px; }
  .pergunta { font-size: 16px; margin: 2px 0 6px; line-height: 1.3; }
  .paineis { grid-template-columns: 1fr; gap: 6px; }
  .painel { padding: 4px 6px 6px; }
  .rotulo { margin: 0 2px 3px; font-size: 12px; }
  .imgbox { height: 30vh; }
  /* par: as duas imagens cabem juntas acima dos botões, sem rolar */
  .par .imgbox { height: max(140px, calc((100svh - 330px) / 2)); }
  .ab .imgbox, .escolha .imgbox { height: 26vh; }
  .botoes button { font-size: 15px; padding: 8px 6px; min-height: 52px; }
  .rodape { padding-top: 8px; }
  .extras button.link { min-height: 34px; padding: 4px 6px; }
}
/* opções clicáveis (escolha) */
.opcoes { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.opcao { text-align: left; padding: 8px; display: block; width: 100%; }
.opcao.sel, .botoes button.sel { background: var(--sel); border-color: var(--pri); }
.opcao .escolher { width: 100%; margin-top: 8px; font-weight: 600; }
.opcao .escolher.sel { background: var(--pri); color: var(--pri-tx); }
.num { display: inline-block; font-weight: 700; background: var(--pri); color: var(--pri-tx); border-radius: 8px; padding: 0 8px; margin: 2px 4px 6px; }
/* botões de resposta */
.rodape { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--linha);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
.rodape .dentro { max-width: 980px; margin: 0 auto; }
.botoes { display: grid; gap: 8px; grid-template-columns: repeat(var(--n, 3), 1fr); }
.botoes button { font-weight: 600; }
.botoes button.sim { border-color: var(--ok); color: var(--ok); }
.botoes button.nao { border-color: var(--nao); color: var(--nao); }
.botoes button.sim.sel { background: var(--ok); color: #fff; }
.botoes button.nao.sel { background: var(--nao); color: #fff; }
.extras { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.escala-rot { display: flex; justify-content: space-between; font-size: 13px; color: var(--tx2); margin-bottom: 4px; }
@media (max-width: 640px) { .botoes.muitos { grid-template-columns: 1fr 1fr; } }
/* exemplo */
.exemplo .botoes button { pointer-events: none; }
.certo { outline: 3px solid var(--ok); }
/* zoom */
#zoom { position: fixed; inset: 0; z-index: 20; background: #000e; display: none; overflow: auto; touch-action: pan-x pan-y pinch-zoom; }
#zoom.aberto { display: flex; align-items: center; justify-content: center; }
#zoom.aberto.grande { display: block; }
#zoom img { display: block; margin: auto; max-width: 100vw; max-height: 100vh; cursor: zoom-in; }
#zoom.grande img { max-width: none; max-height: none; width: auto; min-width: 200vw; cursor: zoom-out; }
#zoom .fechar { position: fixed; top: 10px; right: 10px; z-index: 21; background: #fff; color: #000; min-height: 44px; border-radius: 99px; }
#zoom .dica { position: fixed; left: 10px; bottom: 12px; color: #fff; font-size: 13px; background: #0008; padding: 4px 8px; border-radius: 8px; }
.erro { color: var(--nao); font-weight: 600; }
.centro { text-align: center; }
.oculto { display: none !important; }
</style>
</head>
<body>
<main id="app"><p class="sub">Carregando…</p></main>
<div class="rodape oculto" id="rodape"><div class="dentro" id="rodape-dentro"></div></div>
<div id="zoom" role="dialog" aria-label="Imagem ampliada">
  <button class="fechar" type="button" aria-label="Fechar">Fechar ✕</button>
  <img alt="">
  <div class="dica">Toque na imagem para aproximar. Pinça também funciona.</div>
</div>
<script src="config.js"></script>
<script>
(() => {
'use strict';
const C = window.AV_CONFIG;
const app = document.getElementById('app');
const rodape = document.getElementById('rodape');
const rodapeDentro = document.getElementById('rodape-dentro');
const zoom = document.getElementById('zoom');
const toque = matchMedia('(hover: none)').matches;
if (toque) document.body.classList.add('toque');

const qs = new URLSearchParams(location.search);
let sessao = (qs.get('s') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
const testeSlug = (qs.get('t') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
let D = null;          // dados da sessão
let atual = 0;         // índice em D.itens
let t0 = 0;            // início da tela atual
let ocupado = false;
let teclas = null;     // mapa tecla -> ação da tela atual

// ---------- utilidades
function el(tag, attrs, ...filhos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.setAttribute('style', v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const f of filhos.flat()) if (f != null && f !== false) e.append(f.nodeType ? f : document.createTextNode(String(f)));
  return e;
}
function urlMidia(caminho) { return C.url + '/storage/v1/object/public/' + C.bucket + '/' + caminho.split('/').map(encodeURIComponent).join('/'); }
async function rpc(fn, args) {
  const r = await fetch(C.url + '/rest/v1/rpc/' + fn, {
    method: 'POST', headers: { apikey: C.chave, 'Content-Type': 'application/json' }, body: JSON.stringify(args)
  });
  if (!r.ok) throw new Error('Falha de conexão (' + r.status + ').');
  return r.json();
}
function limpar() { app.replaceChildren(); rodape.classList.add('oculto'); rodapeDentro.replaceChildren(); teclas = null; window.scrollTo(0, 0); }
function erroTela(msg, tentar) {
  limpar();
  app.append(el('div', { class: 'card' }, el('p', { class: 'erro' }, msg),
    tentar ? el('button', { class: 'pri', type: 'button', onclick: tentar }, 'Tentar de novo') : null));
}
function chaveLocal() { return 'av:sessao:' + testeSlug; }
function salvarSessaoLocal(cod) { try { if (testeSlug) localStorage.setItem(chaveLocal(), cod); } catch (e) {} }
function lerSessaoLocal() { try { return testeSlug ? localStorage.getItem(chaveLocal()) : null; } catch (e) { return null; } }
function irParaSessao(cod) {
  sessao = cod; salvarSessaoLocal(cod);
  const u = new URL(location.href); u.searchParams.delete('t'); u.searchParams.set('s', cod);
  history.replaceState(null, '', u.toString());
}

// ---------- imagens e zoom
function imagem(m, alt) {
  if (!m || !m.img) return null;
  const im = el('img', { alt: alt || '', loading: 'eager', decoding: 'async' });
  im.src = urlMidia(m.img);
  im.onerror = () => { if (m.mini && !im.dataset.tentou) { im.dataset.tentou = '1'; im.src = urlMidia(m.mini); } };
  return el('div', { class: 'imgbox', role: 'button', tabindex: '0', 'aria-label': 'Ampliar imagem',
    onclick: () => abrirZoom(m), onkeydown: (ev) => { if (ev.key === 'Enter') abrirZoom(m); } },
    im, el('span', { class: 'lupa' }, 'ampliar'));
}
function abrirZoom(m) {
  const im = zoom.querySelector('img');
  im.src = urlMidia(m.img);
  zoom.classList.remove('grande'); zoom.classList.add('aberto'); zoom.scrollTo(0, 0);
}
function fecharZoom() { zoom.classList.remove('aberto', 'grande'); }
zoom.querySelector('.fechar').addEventListener('click', fecharZoom);
zoom.addEventListener('click', (ev) => {
  if (ev.target.tagName !== 'IMG') { if (!ev.target.closest('.fechar')) fecharZoom(); return; }
  const im = ev.target, r = im.getBoundingClientRect();
  const fx = (ev.clientX - r.left) / r.width, fy = (ev.clientY - r.top) / r.height;
  zoom.classList.toggle('grande');
  if (zoom.classList.contains('grande')) requestAnimationFrame(() => {
    const r2 = im.getBoundingClientRect();
    zoom.scrollTo(fx * r2.width - innerWidth / 2, fy * r2.height - innerHeight / 2);
  });
});
function preCarregar(i) {
  for (const k of [i + 1, i + 2]) {
    const it = D && D.itens[k]; if (!it) continue;
    for (const m of [...(it.paineis || []), ...(it.opcoes || [])]) if (m.img) { const x = new Image(); x.src = urlMidia(m.img); }
  }
}

// ---------- telas
function telaNome() {
  limpar();
  const inp = el('input', { type: 'text', maxlength: '60', autocomplete: 'nickname', placeholder: 'Ex.: Ana', 'aria-label': 'Seu nome ou apelido' });
  const msg = el('p', { class: 'erro oculto' });
  const ir = async () => {
    const nome = inp.value.trim();
    if (!nome) { msg.textContent = 'Escreva um nome ou apelido.'; msg.classList.remove('oculto'); return; }
    bt.disabled = true;
    try {
      const r = await rpc('av_iniciar', { p_teste: testeSlug, p_nome: nome });
      if (!r.ok) throw new Error(r.erro || 'Não deu para começar.');
      irParaSessao(r.sessao); await carregar();
    } catch (e) { msg.textContent = e.message; msg.classList.remove('oculto'); bt.disabled = false; }
  };
  const bt = el('button', { class: 'pri largo', type: 'button', onclick: ir }, 'Continuar');
  inp.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') ir(); });
  app.append(el('div', { class: 'card' }, el('h1', {}, 'Antes de começar'),
    el('label', {}, el('p', {}, 'Seu nome ou apelido'), inp), msg, el('p', {}, bt),
    el('p', { class: 'sub' }, 'Guarde este link: dá para parar e voltar depois de onde parou.')));
  inp.focus();
}

function telaConfirmar() {
  limpar();
  const inp = el('input', { type: 'text', maxlength: '60', value: D.nome || '', 'aria-label': 'Seu nome ou apelido' });
  const caixa = el('div', { class: 'oculto' }, el('p', {}, 'Seu nome ou apelido'), inp);
  const msg = el('p', { class: 'erro oculto' });
  const ir = async () => {
    bt.disabled = true;
    try {
      const nome = caixa.classList.contains('oculto') ? null : inp.value.trim();
      const r = await rpc('av_confirmar', { p_sessao: sessao, p_nome: nome });
      if (!r.ok) throw new Error(r.erro);
      D.confirmada = true; if (nome) D.nome = nome; telaIntro();
    } catch (e) { msg.textContent = e.message; msg.classList.remove('oculto'); bt.disabled = false; }
  };
  const bt = el('button', { class: 'pri largo', type: 'button', onclick: ir }, 'Sou eu, continuar');
  app.append(el('div', { class: 'card' }, el('h1', {}, 'Olá!'),
    el('p', {}, 'Este link é de ', el('strong', {}, D.nome || 'você'), '.'),
    caixa, msg, el('p', {}, bt),
    el('button', { class: 'link', type: 'button', onclick: () => { caixa.classList.remove('oculto'); inp.focus(); } }, 'Corrigir o nome')));
}

function botoesDoItem(it) {
  if (it.tipo === 'par') {
    const bs = (D.teste.botoes && D.teste.botoes.length) ? D.teste.botoes
      : [{ valor: 'sim', rotulo: 'Sim' }, { valor: 'nao', rotulo: 'Não' }, { valor: 'nao_sei', rotulo: 'Não dá para saber' }];
    return bs.map((b, i) => ({ valor: b.valor, rotulo: b.rotulo, teclas: [String(i + 1)].concat(b.tecla ? [b.tecla] : []),
      classe: b.valor === 'sim' ? 'sim' : b.valor === 'nao' ? 'nao' : '' }));
  }
  if (it.tipo === 'ab') return [
    { valor: '1', rotulo: 'A', teclas: ['a', '1'] }, { valor: '2', rotulo: 'B', teclas: ['b', '2'] },
    { valor: 'ambas_boas', rotulo: 'As duas boas', teclas: ['3'] }, { valor: 'ambas_ruins', rotulo: 'As duas ruins', teclas: ['4'] }];
  if (it.tipo === 'escolha') return [
    { valor: 'nenhum', rotulo: 'Nenhum', teclas: ['0'] }, { valor: 'nao_sei', rotulo: 'Não sei', teclas: ['x'] }];
  if (it.tipo === 'nota') return [1, 2, 3, 4, 5].map(n => ({ nota: n, rotulo: String(n), teclas: [String(n)] }));
  return [];
}

function conteudoItem(it, opts) {
  // opts: {exemplo, aoEscolherOpcao(valor), marcada}
  const corpo = el('div', { class: it.tipo });
  if (it.pergunta) corpo.append(el('div', { class: 'pergunta' }, it.pergunta));
  if (it.texto) corpo.append(el('div', { class: 'card texto' }, it.texto));
  const pn = (it.paineis || []);
  if (pn.length) {
    const g = el('div', { class: 'paineis', style: '--np:' + Math.min(pn.length, 2) });
    pn.forEach((p, i) => g.append(el('div', { class: 'painel' },
      el('div', { class: 'rotulo' }, p.rotulo || (pn.length === 2 ? (i === 0 ? 'Esquerda' : 'Direita') : 'Imagem ' + (i + 1))),
      imagem(p, p.rotulo), p.texto ? el('div', { class: 'texto' }, p.texto) : null)));
    corpo.append(g);
  }
  const ops = it.opcoes || [];
  if (it.tipo === 'ab' && ops.length) {
    const g = el('div', { class: 'paineis' });
    ops.forEach((o, i) => g.append(el('div', { class: 'painel' },
      el('div', { class: 'rotulo' }, i === 0 ? 'A' : 'B'), imagem(o, i === 0 ? 'A' : 'B'), o.texto ? el('div', { class: 'texto' }, o.texto) : null)));
    corpo.append(g);
  }
  if (it.tipo === 'escolha' && ops.length) {
    const g = el('div', { class: 'opcoes' });
    ops.forEach((o, i) => {
      const valor = String(i + 1);
      // a imagem amplia; escolher é sempre pelo botão (ou pela tecla do número)
      const b = el('div', { class: 'card opcao' + (opts.marcada === valor ? ' sel' : '') },
        el('span', { class: 'num' }, valor), imagem(o, 'Opção ' + valor), o.texto ? el('div', { class: 'texto' }, o.texto) : null,
        opts.exemplo ? null : el('button', { type: 'button', class: 'escolher' + (opts.marcada === valor ? ' sel' : ''),
          onclick: () => opts.aoEscolher && opts.aoEscolher({ valor }) }, 'Escolher ' + valor,
          toque ? null : el('span', { class: 'tecla' }, valor)));
      g.append(b);
    });
    corpo.append(g);
  }
  return corpo;
}

function linhaBotoes(it, opts) {
  const bs = botoesDoItem(it);
  const caixa = el('div', {});
  if (it.tipo === 'nota' && it.escala) caixa.append(el('div', { class: 'escala-rot' },
    el('span', {}, '1 = ' + (it.escala.min || '')), el('span', {}, '5 = ' + (it.escala.max || ''))));
  const g = el('div', { class: 'botoes' + (bs.length > 3 ? ' muitos' : ''), style: '--n:' + bs.length });
  for (const b of bs) {
    const marcado = (b.nota != null && opts.notaMarcada === b.nota) || (b.valor != null && opts.marcada === b.valor);
    const certo = opts.certo != null && (b.valor === opts.certo || String(b.nota) === String(opts.certo));
    g.append(el('button', { type: 'button', class: (b.classe || '') + (marcado ? ' sel' : '') + (certo ? ' certo sel' : ''),
      onclick: () => opts.aoEscolher && opts.aoEscolher(b) },
      b.rotulo, (!opts.exemplo && b.teclas) ? el('span', { class: 'tecla' }, b.teclas[0].toUpperCase()) : null));
  }
  caixa.append(g);
  return { caixa, bs };
}

function telaIntro() {
  limpar();
  const T = D.teste || {};
  const resp = D.itens.filter(i => i.resposta).length;
  const card = el('div', { class: 'card' }, el('h1', {}, T.titulo || 'Avaliação'));
  for (const f of (Array.isArray(T.introducao) ? T.introducao : [T.introducao]).filter(Boolean)) card.append(el('p', {}, f));
  card.append(el('p', { class: 'sub' }, D.itens.length + ' perguntas' + (T.tempo_min ? ', cerca de ' + T.tempo_min + ' minutos' : '') +
    '. Uma por tela. Dá para parar e voltar pelo mesmo link.'));
  if (!toque) card.append(el('p', { class: 'sub' }, 'No computador, use as teclas mostradas nos botões. Enter amplia a imagem selecionada; Esc fecha.'));
  app.append(card);
  if (T.exemplo) {
    const ex = T.exemplo;
    const it = { tipo: ex.tipo || T.tipo || 'par', pergunta: ex.pergunta || T.pergunta, texto: ex.texto, paineis: ex.paineis, opcoes: ex.opcoes, escala: ex.escala || T.escala };
    const caixa = el('div', { class: 'card exemplo' }, el('h2', {}, 'Exemplo resolvido'), conteudoItem(it, { exemplo: true, marcada: ex.resposta }));
    caixa.append(el('div', { style: 'margin-top:10px' }, linhaBotoes(it, { exemplo: true, certo: ex.resposta }).caixa));
    if (ex.explicacao) caixa.append(el('p', {}, el('strong', {}, 'Por quê: '), ex.explicacao));
    app.append(caixa);
  }
  const inicio = el('button', { class: 'pri largo', type: 'button', onclick: () => { atual = primeiraPendente(); telaPergunta(); } },
    resp ? 'Continuar (' + resp + ' de ' + D.itens.length + ' respondidas)' : 'Começar');
  rodapeDentro.append(inicio); rodape.classList.remove('oculto');
  teclas = { enter: () => inicio.click() };
  preCarregar(-1);
}

function primeiraPendente() { const i = D.itens.findIndex(x => !x.resposta); return i < 0 ? D.itens.length - 1 : i; }

function telaPergunta() {
  limpar();
  const it = D.itens[atual];
  const n = D.itens.length;
  const feitas = D.itens.filter(x => x.resposta).length;
  app.append(el('div', { class: 'topo' }, el('div', { class: 'barra' }, el('div', { style: 'width:' + (100 * feitas / n).toFixed(1) + '%' })),
    el('div', { class: 'cont' }, el('span', {}, 'Pergunta ' + (atual + 1) + ' de ' + n), el('span', {}, feitas + ' respondidas'))));
  const r = it.resposta || {};
  const coment = el('textarea', { maxlength: '2000', placeholder: 'Comentário (opcional)', 'aria-label': 'Comentário' });
  coment.value = r.comentario || '';
  const caixaComent = el('div', { class: r.comentario ? '' : 'oculto', style: 'margin-top:10px' }, coment);
  const msg = el('p', { class: 'erro oculto' });
  const escolher = (b) => responder(it, b, coment.value, msg);
  app.append(conteudoItem(it, { aoEscolher: escolher, marcada: r.exibida }), caixaComent, msg);
  const { caixa, bs } = linhaBotoes(it, { aoEscolher: escolher, marcada: r.exibida, notaMarcada: r.nota });
  const extras = el('div', { class: 'extras' },
    atual > 0 ? el('button', { class: 'link', type: 'button', onclick: () => { atual--; telaPergunta(); } }, '← Voltar') : el('span'),
    D.teste.comentario === false ? el('span') :
      el('button', { class: 'link', type: 'button', onclick: () => { caixaComent.classList.toggle('oculto'); if (!caixaComent.classList.contains('oculto')) coment.focus(); } },
        'Comentar' + (toque ? '' : ' (C)')));
  rodapeDentro.append(caixa, extras); rodape.classList.remove('oculto');
  teclas = {};
  for (const b of bs) for (const k of (b.teclas || [])) teclas[k.toLowerCase()] = () => escolher(b);
  if (it.tipo === 'escolha') (it.opcoes || []).forEach((o, i) => { teclas[String(i + 1)] = () => escolher({ valor: String(i + 1) }); });
  teclas.c = () => { caixaComent.classList.remove('oculto'); coment.focus(); };
  teclas.arrowleft = () => { if (atual > 0) { atual--; telaPergunta(); } };
  t0 = performance.now();
  preCarregar(atual);
}

async function responder(it, b, comentario, msg) {
  if (ocupado) return;
  ocupado = true;
  const ms = Math.min(86400000, Math.round(performance.now() - t0));
  const args = { p_sessao: sessao, p_pos: it.pos, p_escolha: b.valor != null ? b.valor : null, p_nota: b.nota != null ? b.nota : null,
                 p_comentario: comentario || null, p_ms: ms };
  try {
    const r = await rpc('av_responder', args);
    if (!r.ok) throw new Error(r.erro || 'Não foi possível salvar.');
    it.resposta = { exibida: args.p_escolha, nota: args.p_nota, comentario: args.p_comentario };
    ocupado = false;
    const prox = D.itens.findIndex((x, k) => k > atual && !x.resposta);
    const qualquer = D.itens.findIndex(x => !x.resposta);
    if (prox >= 0) { atual = prox; telaPergunta(); }
    else if (qualquer >= 0) { atual = qualquer; telaPergunta(); }
    else await telaFim();
  } catch (e) {
    ocupado = false;
    msg.textContent = (e.message || 'Erro') + ' Sua resposta não foi salva; toque de novo.';
    msg.classList.remove('oculto');
  }
}

async function telaFim() {
  limpar();
  let n = D.itens.filter(x => x.resposta).length, total = D.itens.length;
  try { const r = await rpc('av_finalizar', { p_sessao: sessao }); if (r.ok) { n = r.respondidas; total = r.total; } } catch (e) {}
  app.append(el('div', { class: 'card centro' }, el('h1', {}, 'Obrigado!'),
    el('p', {}, 'Você respondeu ' + n + ' de ' + total + ' perguntas.'),
    D.teste.fim ? el('p', {}, D.teste.fim) : null,
    el('p', { class: 'sub' }, 'Pode fechar esta página.'),
    el('button', { class: 'link', type: 'button', onclick: () => { atual = 0; telaPergunta(); } }, 'Revisar minhas respostas')));
}

async function carregar() {
  limpar(); app.append(el('p', { class: 'sub' }, 'Carregando…'));
  try {
    const r = await rpc('av_carregar', { p_sessao: sessao });
    if (!r.ok) { try { if (testeSlug) localStorage.removeItem(chaveLocal()); } catch (e) {} return erroTela(r.erro || 'Link inválido.'); }
    D = r;
    document.title = (D.teste && D.teste.titulo) || 'Avaliação';
    if (!D.aberto) return erroTela('Este teste foi encerrado. Obrigado!');
    if (!D.confirmada) return telaConfirmar();
    if (D.itens.length && D.itens.every(x => x.resposta)) return telaFim();
    telaIntro();
  } catch (e) { erroTela(e.message, carregar); }
}

document.addEventListener('keydown', (ev) => {
  if (zoom.classList.contains('aberto')) { if (ev.key === 'Escape') fecharZoom(); return; }
  const alvo = ev.target;
  if (alvo && (alvo.tagName === 'TEXTAREA' || alvo.tagName === 'INPUT')) {
    if (ev.key === 'Escape') alvo.blur();
    return;
  }
  if (ev.ctrlKey || ev.metaKey || ev.altKey || !teclas) return;
  const k = ev.key.toLowerCase();
  if (k === 'enter' && document.activeElement && document.activeElement.classList.contains('imgbox')) return;
  const f = teclas[k] || (k === '?' ? teclas.x : null);
  if (f) { ev.preventDefault(); f(); }
});

// ---------- início
if (!sessao && testeSlug) sessao = lerSessaoLocal() || '';
if (sessao) carregar();
else if (testeSlug) telaNome();
else erroTela('Link incompleto. Peça o link certo a quem enviou o teste.');
})();
</script>
